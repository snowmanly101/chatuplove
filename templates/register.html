{% extends 'base.html' %}

{% block title %}Sign Up - ChatUpLove.chat{% endblock %}

{% block content %}
<style>
    .register-wrapper {
        background: linear-gradient(rgba(24, 29, 56, 0.9), rgba(24, 29, 56, 0.9)), 
                    url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }
    .form-card {
        max-width: 450px;
        width: 100%;
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        color: #1a202c;
    }
    .form-card h2 {
        font-family: 'Georgia', serif;
        font-size: 2.2rem;
        text-align: center;
        color: #181d38;
        margin-bottom: 25px;
    }
    .form-group {
        margin-bottom: 18px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #4a5568;
        font-weight: 600;
        font-size: 0.9rem;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #2d3748;
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
    }
    .form-group input:focus {
        border-color: #ff4b6e;
    }
    .error-msg {
        color: #e53e3e;
        background: #fff5f5;
        padding: 10px;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-bottom: 15px;
        text-align: center;
    }
    .submit-btn {
        width: 100%;
        padding: 15px;
        background-color: #0056b3;
        color: white;
        font-weight: 700;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 10px;
        transition: background-color 0.2s;
    }
    .submit-btn:hover {
        background-color: #004085;
    }
</style>

<div class="register-wrapper">
    <div class="form-card">
        <h2>Create Account</h2>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create password" required>
            </div>
            <div class="form-group">
                <label>Location / City</label>
                <input type="text" name="location" value="{{ initial_location }}" placeholder="e.g. New York, NY">
            </div>
            <div class="form-group">
                <label>I am a</label>
                <select name="gender">
                    <option value="female" {% if initial_gender == 'women' %}selected{% endif %}>Woman</option>
                    <option value="male" {% if initial_gender == 'men' %}selected{% endif %}>Man</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Join ChatUpLove</button>
        </form>
    </div>
</div>
{% endblock %}
