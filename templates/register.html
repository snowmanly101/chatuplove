{% extends 'base.html' %}

{% block title %}Sign Up - ChatUpLove.chat{% endblock %}

{% block content %}
<style>
    .register-wrapper {
        background: linear-gradient(rgba(24, 29, 56, 0.85), rgba(24, 29, 56, 0.85)), 
                    url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        min-height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 15px;
    }
    .form-card {
        max-width: 520px;
        width: 100%;
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        color: #1a202c;
    }
    .form-card h2 {
        font-family: 'Georgia', serif;
        font-size: 2rem;
        text-align: center;
        color: #181d38;
        margin-bottom: 8px;
    }
    .form-subtitle {
        text-align: center;
        color: #718096;
        font-size: 0.9rem;
        margin-bottom: 25px;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group.full-width {
        grid-column: span 2;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #4a5568;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 12px 14px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        color: #2d3748;
        border-radius: 10px;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
        border-color: #ff4b6e;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(255, 75, 110, 0.15);
    }
    .error-msg {
        color: #e53e3e;
        background: #fff5f5;
        border: 1px solid #feb2b2;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        text-align: center;
    }
    .submit-btn {
        width: 100%;
        padding: 14px;
        background-color: #ff4b6e;
        color: white;
        font-weight: 700;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 10px;
        transition: background-color 0.2s, transform 0.1s;
    }
    .submit-btn:hover {
        background-color: #e03b5b;
        transform: translateY(-1px);
    }
    @media (max-width: 600px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
        .form-group.full-width {
            grid-column: span 1;
        }
    }
</style>

<div class="register-wrapper">
    <div class="form-card">
        <h2>Find Your Match</h2>
        <p class="form-subtitle">Create your account to start meeting local singles.</p>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <label>City / Location</label>
                    <input type="text" name="location" value="{{ initial_location }}" placeholder="e.g. New York, NY">
                </div>
                <div class="form-group">
                    <label>I am a</label>
                    <select name="gender">
                        <option value="female" {% if initial_gender == 'female' %}selected{% endif %}>Woman</option>
                        <option value="male" {% if initial_gender == 'male' %}selected{% endif %}>Man</option>
                        <option value="other" {% if initial_gender == 'other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Seeking</label>
                    <select name="looking_for">
                        <option value="male">Man</option>
                        <option value="female">Woman</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>About Me (Bio)</label>
                    <textarea name="bio" rows="3" placeholder="Share a little bit about your lifestyle and interests..."></textarea>
                </div>
            </div>
            <button type="submit" class="submit-btn">Complete Registration</button>
        </form>
    </div>
</div>
{% endblock %}
