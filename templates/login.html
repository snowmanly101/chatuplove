{% extends 'base.html' %}
{% block title %}Sign In - ChatUpLove.chat{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
    <h2 style="margin-bottom: 20px; color: #181d38; text-align: center; font-family: 'Georgia', serif;">Welcome Back</h2>
    
    {% if error %}
        <div style="background: #ffe5ea; color: #ff4b6e; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem;">Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem;">
        </div>
        <button type="submit" style="width: 100%; background-color: #ff4b6e; color: white; padding: 12px; border: none; border-radius: 25px; font-weight: 700; font-size: 1rem; cursor: pointer;">Sign In</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #718096;">
        Don't have an account? <a href="{% url 'register' %}" style="color: #ff4b6e; text-decoration: none; font-weight: 600;">Sign up</a>
    </p>
</div>
{% endblock %}
